name: Render Mermaid Diagrams

on:
  push:
    branches: [main]
    paths:
      - 'architecture/*.mmd'
  pull_request:
    paths:
      - 'architecture/*.mmd'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Mermaid CLI
        run: npm install -g @mermaid-js/mermaid-cli

      - name: Create Puppeteer config for CI
        run: |
          echo '{"args": ["--no-sandbox", "--disable-setuid-sandbox"]}' > puppeteer-config.json

      - name: Test and render each diagram to SVG
        run: |
          mkdir -p architecture/svg
          for f in architecture/*.mmd; do
            name=$(basename "$f" .mmd)
            echo "Rendering $f"
            mmdc -i "$f" -o "architecture/svg/${name}.svg" -b transparent -p puppeteer-config.json
          done

      - name: Upload SVGs as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-svgs
          path: architecture/svg/*.svg

      - name: Commit rendered SVGs back to the repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add architecture/svg
          git diff --staged --quiet || git commit -m "Auto-render Mermaid diagrams to SVG [skip ci]"
          git push
